name: CI

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roadmap:
    name: roadmap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate roadmap graph
        run: python3 scripts/roadmap.py check
      - name: Test roadmap synchronizer
        run: python3 -m unittest discover -s tests -p 'test_roadmap.py' -v
      - name: Check compatibility matrix
        run: python3 scripts/compatibility.py check
      - name: Test compatibility matrix checker
        run: python3 -m unittest discover -s tests -p 'test_compatibility.py' -v
      - name: Verify task index
        run: |
          python3 scripts/roadmap.py index > /tmp/ghostrace-roadmap-index.md
          diff -u .forge/tasks/README.md /tmp/ghostrace-roadmap-index.md

  reproducibility:
    name: reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned inputs
        run: python3 scripts/reproducibility.py check
      - name: Test reproducibility contract
        run: python3 -m unittest discover -s tests -p 'test_reproducibility.py' -v

  permissions:
    name: permissions
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: 1.88.0
      - name: Test permission manifest contract
        run: python3 -m unittest discover -s tests -p 'test_permissions.py' -v
      - name: Build release artifact
        run: cargo build --release --locked
      - name: Compare signed artifact with the reviewed manifest
        run: python3 scripts/permissions.py check --binary target/release/ghostrace

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: 1.88.0
          components: clippy
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux stable
            os: ubuntu-latest
            toolchain: 1.88.0
          - name: macOS stable
            os: macos-latest
            toolchain: 1.88.0
          - name: Linux MSRV
            os: ubuntu-latest
            toolchain: 1.88.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Run tests
        run: |
          if [ "${{ matrix.name }}" = "macOS stable" ]; then
            # The native FSEvents benchmark is a separately authorized,
            # resource-bound device lane; keep the general CI contract
            # deterministic and run its explicit command on the named device.
            cargo test --locked --all-targets --all-features -- \
              --skip native_benchmark_runs_all_synthetic_workloads_and_emits_receipt
          else
            cargo test --locked --all-targets --all-features
          fi
