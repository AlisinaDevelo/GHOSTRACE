name: Offline fixture lane

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: offline-network-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-fixture-path:
    name: fixture path with network denied
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          toolchain: 1.88.0

      # Fetching is intentionally outside the denied process. The product path
      # below mounts this cache read-only and sets CARGO_NET_OFFLINE=true.
      - name: Fetch locked dependencies before denial
        run: cargo +1.88.0 fetch --locked

      - name: Pull the pinned runner image before denial
        run: docker pull --platform linux/amd64 rust@sha256:a6cab604fa016ac022e78c24038497eb7617ab59150ca4c3dd2ede0fbd514d4b

      - name: Run canary and fixture path with no network
        run: |
          mkdir -p "$HOME/.cargo/git"
          docker run --rm \
            --network=none \
            --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --env CARGO_NET_OFFLINE=true \
            --env GHOSTRACE_OFFLINE_ENFORCED=1 \
            --env GHOSTRACE_OFFLINE_MODE=docker-network-none \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$HOME/.cargo/registry:/usr/local/cargo/registry:ro" \
            --volume "$HOME/.cargo/git:/usr/local/cargo/git:ro" \
            --workdir /workspace \
            rust@sha256:a6cab604fa016ac022e78c24038497eb7617ab59150ca4c3dd2ede0fbd514d4b \
            bash scripts/offline-network-test.sh --inside
