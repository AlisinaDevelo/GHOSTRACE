[package]
name = "ghostrace"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
description = "A fixture-only, local event journal vertical slice"
license = "MPL-2.0"
repository = "https://github.com/AlisinaDevelo/GHOSTRACE"
readme = "README.md"
keywords = ["macos", "provenance", "forensics", "privacy"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[lib]
name = "ghostrace"
path = "src/lib.rs"

[[bin]]
name = "ghostrace"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive"] }
chacha20poly1305 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tempfile = "3.14"
url = "2.5"
uuid = { version = "1.10", features = ["serde", "v4"] }

[dev-dependencies]
jsonschema = { version = "0.50", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", default-features = false, features = ["OSX_10_15"] }

[profile.dev]
debug = 1

[profile.test]
debug = 1
