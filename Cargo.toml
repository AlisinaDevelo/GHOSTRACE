[package]
name = "ghostrace"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
description = "Local macOS event provenance journal for evidence-linked change explanation"
license = "MPL-2.0"
repository = "https://github.com/AlisinaDevelo/GHOSTRACE"
readme = "README.md"
keywords = ["macos", "provenance", "forensics", "privacy"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[lib]
name = "ghostrace"
path = "src/lib.rs"

[[bin]]
name = "ghostrace"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive"] }
chacha20poly1305 = "0.11"
rusqlite = { version = "0.40", features = ["bundled", "hooks", "limits"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tempfile = "3.14"
url = "2.5"
uuid = { version = "1.10", features = ["serde", "v4"] }
parquet = { version = "60", default-features = false, features = ["zstd"], optional = true }

[features]
# Opt-in NSWorkspace frontmost-app adapter. Links AppKit, so default builds do not.
frontmost = ["dep:core-foundation"]
# Opt-in Parquet cold-archive writer. Default and release builds do not link it.
parquet = ["dep:parquet"]

[[test]]
name = "frontmost_macos"
harness = false

[dev-dependencies]
jsonschema = { version = "0.57", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", default-features = false, features = ["OSX_10_15"] }
core-foundation = { version = "0.10", optional = true }

[profile.dev]
debug = 1

[profile.test]
debug = 1
